services:
  server:
    build:
      context: ./nest-server
      target: development
    volumes:
      - ./nest-server:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file: ./nest-server/.env.development.local
    command: npm run start:dev
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
    pg_data: